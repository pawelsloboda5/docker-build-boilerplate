name: Docker Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]   # e.g. v1.2.3
  workflow_dispatch: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }} # org/repo
  # Build only amd64 by default to avoid native binary surprises
  PLATFORMS: linux/amd64

jobs:
  login:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ env.REGISTRY }}
      image_base: ${{ env.IMAGE_BASE }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # If you prefer Docker Hub, replace the step above with:
      # - uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      #
      # And set:
      #   REGISTRY: docker.io
      #   IMAGE_BASE: <your-dockerhub-namespace>/<repo>

  meta:
    runs-on: ubuntu-latest
    outputs:
      TAGS_WEB: ${{ steps.web-tags.outputs.tags }}
      TAGS_API: ${{ steps.api-tags.outputs.tags }}
      TAGS_DB:  ${{ steps.db-tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: |
          SHA_TAG=${GITHUB_SHA::12}
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT
          # main gets "latest"; tags get their semver
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            echo "is_main=true" >> $GITHUB_OUTPUT
          else
            echo "is_main=false" >> $GITHUB_OUTPUT
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "ref_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "ref_tag=" >> $GITHUB_OUTPUT
          fi

      - id: web-tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-web:${{ steps.vars.outputs.sha_tag }}"
          if [[ "${{ steps.vars.outputs.is_main }}" == "true" ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-web:latest"
          fi
          if [[ -n "${{ steps.vars.outputs.ref_tag }}" ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-web:${{ steps.vars.outputs.ref_tag }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - id: api-tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-api:${{ steps.vars.outputs.sha_tag }}"
          if [[ "${{ steps.vars.outputs.is_main }}" == "true" ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-api:latest"
          fi
          if [[ -n "${{ steps.vars.outputs.ref_tag }}" ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-api:${{ steps.vars.outputs.ref_tag }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - id: db-tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-db:${{ steps.vars.outputs.sha_tag }}"
          if [[ "${{ steps.vars.outputs.is_main }}" == "true" ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-db:latest"
          fi
          if [[ -n "${{ steps.vars.outputs.ref_tag }}" ]]; then
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-db:${{ steps.vars.outputs.ref_tag }}"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

  build:
    needs: [login, meta]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile
            target: prod
            tags_output: TAGS_WEB
          - name: api
            context: ./api
            dockerfile: ./api/Dockerfile
            target: dev   # your api image is already "final" in its Dockerfile
            tags_output: TAGS_API
          - name: db
            context: ./db
            dockerfile: ./db/Dockerfile
            target: default
            tags_output: TAGS_DB
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (only needed if you later add arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: ${{ matrix.service.target }}
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ needs.meta.outputs[matrix.service.tags_output] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # If you need build-time envs, add them here:
          # build-args: |
          #   NEXT_PUBLIC_API_URL=https://your-api.example.com
